server:
  port: 8080

blocklog:
  data-dir: ./data
  max-batch-records: 1000
  max-batch-bytes: 5000000
  max-record-bytes: 65536
  max-tags-per-record: 16
  max-tag-key-bytes: 256
  max-tag-value-bytes: 256
  max-tenant-bytes: 256
  flush-size-bytes: 5000000
  flush-age-seconds: 5
  max-blocks: 10000
  max-query-results: 1000
  default-query-results: 100
  max-query-timeout-ms: 30000
  default-query-timeout-ms: 5000
  scan-permits: 0            # 0 = max(1, availableProcessors - 1)
  max-active-queries: 4
  queue-bytes-budget: 67108864              # 64 MiB queued encoded records
  buffer-bytes-budget: 67108864             # 64 MiB active per-tenant buffers
  # Per-tenant slice of the queue budget. One tenant cannot reserve more than
  # this even if the global cap has room; other tenants keep working. Set to
  # 0 (or leave equal to queue-bytes-budget) to disable per-tenant fairness.
  per-tenant-queue-bytes-budget: 16777216   # 16 MiB per tenant (1/4 of the global)
  shutdown-deadline-seconds: 10
  mmap-cache-size: 256                      # max mmap handles cached before LRU eviction

spring:
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
